name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: Format, lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Check formatting (ruff)
        run: uv run ruff format --check
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Type check (ty)
        run: uv run ty check

  unit-tests:
    name: pytest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      # Unit tests are pure/mocked and excluded from integration tests via
      # the `not integration` default in [tool.pytest.ini_options] addopts.
      - name: Run unit tests
        run: uv run pytest -v --junitxml=unit-test-results.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: unit-test-results.xml

  integration-tests:
    name: pytest (integration)
    runs-on: ubuntu-latest
    env:
      ASPECTED_IMAGE: ${{ vars.ASPECTED_IMAGE }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pull Aspected image
        run: docker pull "${ASPECTED_IMAGE}"
      # testcontainers talks to the Docker daemon directly (via the socket
      # already available on GitHub-hosted runners) to start/stop the
      # Aspected server container per test session.
      - name: Run integration tests
        run: uv run pytest -v -m integration --junitxml=integration-test-results.xml
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: integration-test-results.xml
